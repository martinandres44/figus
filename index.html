<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Figus FWC 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --accent: #f59e0b;
    --accent2: #10b981;
    --accent3: #3b82f6;
    --danger: #ef4444;
    --text: #f1f5f9;
    --muted: #64748b;
    --border: #1e2d45;
    --got: #10b981;
    --missing: #334155;
    --repeated: #f59e0b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(circle at 20% 20%, rgba(245,158,11,0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(59,130,246,0.06) 0%, transparent 50%),
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 40px,
        rgba(255,255,255,0.01) 40px,
        rgba(255,255,255,0.01) 41px
      );
    pointer-events: none;
    z-index: 0;
  }

  .container { position: relative; z-index: 1; }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #0f1929 0%, #1a2235 100%);
    border-bottom: 2px solid var(--accent);
    padding: 16px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 30px rgba(0,0,0,0.5);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(245,158,11,0.4);
  }

  .logo span { color: var(--text); }

  /* Global progress bar */
  .global-progress {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-bar-wrap {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .progress-text {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .progress-text strong { color: var(--accent2); }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 12px 20px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 1px;
    padding: 8px 16px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--muted);
    white-space: nowrap;
    transition: all 0.2s;
    position: relative;
  }

  .tab:hover { color: var(--text); background: var(--surface2); }

  .tab.active {
    color: var(--accent);
    background: var(--bg);
    border-top: 2px solid var(--accent);
  }

  .tab .badge {
    display: inline-block;
    background: var(--accent);
    color: #000;
    font-size: 9px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 99px;
    margin-left: 4px;
    vertical-align: middle;
  }

  /* VIEWS */
  .view { display: none; padding: 16px 20px; }
  .view.active { display: block; }

  /* SEARCH & FILTER */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--muted); }

  .filter-btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .filter-btn:hover, .filter-btn.active { 
    border-color: var(--accent); 
    color: var(--accent); 
    background: rgba(245,158,11,0.08);
  }

  /* COUNTRY SECTION */
  .country-section {
    margin-bottom: 20px;
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .country-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--surface2);
    cursor: pointer;
    user-select: none;
    gap: 10px;
  }

  .country-header:hover { background: #1e2d45; }

  .country-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 1px;
    color: var(--text);
  }

  .country-stats {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
  }

  .stat-pill {
    padding: 2px 8px;
    border-radius: 99px;
    font-weight: 600;
    font-size: 11px;
  }
  .pill-got { background: rgba(16,185,129,0.2); color: var(--got); }
  .pill-missing { background: rgba(51,65,85,0.5); color: #94a3b8; }
  .pill-rep { background: rgba(245,158,11,0.2); color: var(--accent); }

  .mini-progress {
    width: 80px;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .mini-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  .chevron {
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.2s;
  }
  .country-section.collapsed .chevron { transform: rotate(-90deg); }

  .stickers-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
    gap: 6px;
    padding: 12px 16px;
  }

  .country-section.collapsed .stickers-grid { display: none; }

  /* STICKER CARD */
  .sticker {
    position: relative;
    aspect-ratio: 3/4;
    border-radius: 8px;
    border: 2px solid var(--missing);
    background: var(--surface2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    overflow: hidden;
  }

  .sticker:hover { transform: scale(1.05); border-color: var(--muted); }

  .sticker.got {
    border-color: var(--got);
    background: rgba(16,185,129,0.12);
  }

  .sticker.got::after {
    content: '✓';
    position: absolute;
    top: 2px;
    right: 4px;
    font-size: 9px;
    color: var(--got);
    font-weight: 700;
  }

  .sticker-code {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    text-align: center;
    line-height: 1.2;
  }

  .sticker.got .sticker-code { color: var(--got); }

  /* Repeated badge */
  .rep-btn {
    position: absolute;
    bottom: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    color: #000;
    font-size: 9px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 2;
    transition: transform 0.1s;
  }
  .rep-btn:hover { transform: scale(1.2); }
  .rep-btn.hidden { display: none; }

  /* Right-click context menu */
  .ctx-menu {
    position: fixed;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    z-index: 1000;
    min-width: 160px;
    display: none;
  }
  .ctx-menu.show { display: block; }

  .ctx-item {
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.1s;
  }
  .ctx-item:hover { background: var(--border); }
  .ctx-item.danger { color: var(--danger); }
  .ctx-item.success { color: var(--got); }
  .ctx-item.warn { color: var(--accent); }

  /* REPETIDAS VIEW */
  .rep-list { display: flex; flex-direction: column; gap: 12px; }

  .rep-country-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .rep-country-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    padding: 10px 14px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    letter-spacing: 1px;
  }

  .rep-stickers {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 14px;
  }

  .rep-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(245,158,11,0.15);
    border: 1px solid rgba(245,158,11,0.3);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
  }

  .rep-count-ctrl {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .rep-btn-ctrl {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
  }
  .rep-minus { background: rgba(239,68,68,0.2); color: var(--danger); }
  .rep-plus { background: rgba(16,185,129,0.2); color: var(--got); }
  .rep-minus:hover { background: var(--danger); color: white; }
  .rep-plus:hover { background: var(--got); color: white; }
  .rep-count { font-size: 13px; color: var(--text); min-width: 14px; text-align: center; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-state .emoji { font-size: 48px; display: block; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* PROGRESS VIEW */
  .progress-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
  }

  .prog-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    transition: border-color 0.2s;
    cursor: pointer;
  }
  .prog-card:hover { border-color: var(--accent); }
  .prog-card.complete { border-color: var(--got); background: rgba(16,185,129,0.05); }

  .prog-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .prog-country { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 1px; }
  .prog-pct { font-size: 13px; font-weight: 700; color: var(--accent2); }
  .prog-card.complete .prog-pct { color: var(--got); }

  .prog-bar-wrap {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .prog-bar-inner {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 0.4s ease;
  }
  .prog-card.complete .prog-bar-inner { background: var(--got); }

  .prog-sub {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 10px;
  }

  /* Sort bar */
  .sort-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    align-items: center;
  }
  .sort-label { font-size: 12px; color: var(--muted); }
  .sort-btn {
    padding: 4px 12px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .sort-btn.active, .sort-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  /* Summary bar */
  .summary-bar {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .sum-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    text-align: center;
    flex: 1;
    min-width: 100px;
  }
  .sum-val { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 1px; }
  .sum-lbl { font-size: 11px; color: var(--muted); }
  .sum-green { color: var(--got); }
  .sum-yellow { color: var(--accent); }
  .sum-blue { color: var(--accent3); }
  .sum-red { color: var(--danger); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media (max-width: 500px) {
    .stickers-grid { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 4px; }
    .logo { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="container">

<header>
  <div class="header-top">
    <div class="logo">⚽ Figus <span>FWC 2026</span></div>
    <div class="progress-text">
      <strong id="hdr-got">0</strong> / <span id="hdr-total">0</span> conseguidas
    </div>
  </div>
  <div class="global-progress">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="global-bar" style="width:0%"></div>
    </div>
    <div class="progress-text" id="global-pct">0%</div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="showView('album')">📚 Álbum <span class="badge" id="tab-missing-badge">0</span></button>
  <button class="tab" onclick="showView('repetidas')">🔁 Repetidas <span class="badge" id="tab-rep-badge" style="background:var(--accent)">0</span></button>
  <button class="tab" onclick="showView('progreso')">📊 Progreso</button>
</div>

<!-- ALBUM VIEW -->
<div class="view active" id="view-album">
  <div class="controls">
    <input class="search-box" type="text" placeholder="🔍 Buscar selección..." id="search-input" oninput="renderAlbum()">
    <button class="filter-btn active" id="filter-all" onclick="setFilter('all')">Todas</button>
    <button class="filter-btn" id="filter-missing" onclick="setFilter('missing')">Faltantes</button>
    <button class="filter-btn" id="filter-got" onclick="setFilter('got')">Conseguidas</button>
  </div>
  <div id="album-container"></div>
</div>

<!-- REPETIDAS VIEW -->
<div class="view" id="view-repetidas">
  <div id="rep-container"></div>
</div>

<!-- PROGRESO VIEW -->
<div class="view" id="view-progreso">
  <div class="summary-bar">
    <div class="sum-item"><div class="sum-val sum-green" id="sum-got">0</div><div class="sum-lbl">Conseguidas</div></div>
    <div class="sum-item"><div class="sum-val sum-red" id="sum-missing">0</div><div class="sum-lbl">Faltantes</div></div>
    <div class="sum-item"><div class="sum-val sum-yellow" id="sum-rep">0</div><div class="sum-lbl">Repetidas</div></div>
    <div class="sum-item"><div class="sum-val sum-blue" id="sum-complete">0</div><div class="sum-lbl">Completas</div></div>
  </div>
  <div class="sort-bar">
    <span class="sort-label">Ordenar:</span>
    <button class="sort-btn active" onclick="setSortProg('alpha')" id="sort-alpha">A–Z</button>
    <button class="sort-btn" onclick="setSortProg('pct-asc')" id="sort-pct-asc">Menos %</button>
    <button class="sort-btn" onclick="setSortProg('pct-desc')" id="sort-pct-desc">Más %</button>
    <button class="sort-btn" onclick="setSortProg('missing')" id="sort-missing">Más faltantes</button>
  </div>
  <div class="progress-grid" id="prog-container"></div>
</div>

</div>

<!-- Context menu -->
<div class="ctx-menu" id="ctx-menu">
  <div class="ctx-item success" id="ctx-toggle"><span>✓</span> <span id="ctx-toggle-text">Marcar conseguida</span></div>
  <div class="ctx-item warn" id="ctx-add-rep"><span>🔁</span> Agregar repetida</div>
  <div class="ctx-item danger" id="ctx-remove-rep" style="display:none"><span>✕</span> Quitar repetida</div>
</div>

  "Inglaterra": Array.from({length:20},(_,i)=>`ENG ${i+1}`),
  "Croacia": Array.from({length:20},(_,i)=>`CRO ${i+1}`),
  "Ghana": Array.from({length:20},(_,i)=>`GHA ${i+1}`),
  "Panamá": Array.from({length:20},(_,i)=>`PAN ${i+1}`),
};

// ========================
// STATE
// ========================
const STORAGE_KEY = 'figus_fwc2026_v1';

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    return s ? JSON.parse(s) : { got: {}, repeated: {} };
  } catch { return { got: {}, repeated: {} }; }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();
// got: { "ARG 1": true, ... }
// repeated: { "ARG 1": 2, ... }  (count of extra copies)

let currentFilter = 'all';
let currentSortProg = 'alpha';
let collapsedSections = {};
let contextTarget = null;

// ========================
// HELPERS
// ========================
function isGot(code) { return !!state.got[code]; }
function getRep(code) { return state.repeated[code] || 0; }
function totalStickers() { return Object.values(RAW).flat().length; }
function gotCount() { return Object.keys(state.got).filter(k => state.got[k]).length; }
function repCount() { return Object.values(state.repeated).reduce((a,b)=>a+b,0); }

function toggleGot(code) {
  if (state.got[code]) {
    delete state.got[code];
  } else {
    state.got[code] = true;
  }
  saveState();
  refreshAll();
}

function addRep(code) {
  state.repeated[code] = (state.repeated[code] || 0) + 1;
  saveState();
  renderRepetidas();
  updateHeader();
  updateTabBadges();
}

function removeRep(code) {
  if (state.repeated[code] > 1) {
    state.repeated[code]--;
  } else {
    delete state.repeated[code];
  }
  saveState();
  renderRepetidas();
  updateHeader();
  updateTabBadges();
}

// ========================
// VIEWS
// ========================
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'repetidas') renderRepetidas();
  if (name === 'progreso') renderProgreso();
}

// ========================
// ALBUM
// ========================
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('filter-' + f).classList.add('active');
  renderAlbum();
}

function renderAlbum() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const container = document.getElementById('album-container');
  container.innerHTML = '';

  for (const [country, stickers] of Object.entries(RAW)) {
    if (q && !country.toLowerCase().includes(q)) continue;

    const filteredStickers = stickers.filter(code => {
      if (currentFilter === 'missing') return !isGot(code);
      if (currentFilter === 'got') return isGot(code);
      return true;
    });

    if (filteredStickers.length === 0) continue;

    const gotC = stickers.filter(c => isGot(c)).length;
    const total = stickers.length;
    const pct = Math.round(gotC / total * 100);
    const isCollapsed = !!collapsedSections[country];

    const section = document.createElement('div');
    section.className = 'country-section' + (isCollapsed ? ' collapsed' : '');
    section.innerHTML = `
      <div class="country-header" onclick="toggleCollapse('${country}', this.closest('.country-section'))">
        <div class="country-name">${country}</div>
        <div class="country-stats">
          <span class="stat-pill pill-got">${gotC}✓</span>
          <span class="stat-pill pill-missing">${total - gotC} faltan</span>
          ${getRep_country(country) > 0 ? `<span class="stat-pill pill-rep">🔁${getRep_country(country)}</span>` : ''}
          <div class="mini-progress"><div class="mini-progress-fill" style="width:${pct}%"></div></div>
          <span style="font-size:11px;color:var(--muted)">${pct}%</span>
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="stickers-grid" id="grid-${country.replace(/[^a-z0-9]/gi,'_')}"></div>
    `;
    container.appendChild(section);

    const grid = section.querySelector('.stickers-grid');
    for (const code of filteredStickers) {
      const got = isGot(code);
      const rep = getRep(code);
      const card = document.createElement('div');
      card.className = 'sticker' + (got ? ' got' : '');
      card.dataset.code = code;
      const shortCode = code.split(' ').slice(-1)[0];
      card.innerHTML = `
        <div class="sticker-code">${shortCode}</div>
        ${rep > 0 ? `<div class="rep-btn">${rep}</div>` : ''}
      `;
      card.addEventListener('click', () => { toggleGot(code); });
      card.addEventListener('contextmenu', (e) => { e.preventDefault(); showCtxMenu(e, code); });
      grid.appendChild(card);
    }
  }
}

function getRep_country(country) {
  const stickers = RAW[country] || [];
  return stickers.reduce((sum, code) => sum + getRep(code), 0);
}

function toggleCollapse(country, section) {
  collapsedSections[country] = !collapsedSections[country];
  section.classList.toggle('collapsed');
}

// ========================
// CONTEXT MENU
// ========================
function showCtxMenu(e, code) {
  contextTarget = code;
  const menu = document.getElementById('ctx-menu');
  const got = isGot(code);
  const rep = getRep(code);
  document.getElementById('ctx-toggle-text').textContent = got ? 'Quitar conseguida' : 'Marcar conseguida';
  document.getElementById('ctx-toggle').querySelector('span').textContent = got ? '✗' : '✓';
  document.getElementById('ctx-remove-rep').style.display = rep > 0 ? 'flex' : 'none';
  
  menu.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - 120) + 'px';
  menu.classList.add('show');
}

document.getElementById('ctx-toggle').onclick = () => {
  if (contextTarget) { toggleGot(contextTarget); hideCtxMenu(); }
};
document.getElementById('ctx-add-rep').onclick = () => {
  if (contextTarget) { addRep(contextTarget); hideCtxMenu(); }
};
document.getElementById('ctx-remove-rep').onclick = () => {
  if (contextTarget) { removeRep(contextTarget); hideCtxMenu(); }
};

function hideCtxMenu() {
  document.getElementById('ctx-menu').classList.remove('show');
  contextTarget = null;
}
document.addEventListener('click', hideCtxMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCtxMenu(); });

// ========================
// REPETIDAS
// ========================
function renderRepetidas() {
  const container = document.getElementById('rep-container');
  container.innerHTML = '';

  let hasAny = false;
  for (const [country, stickers] of Object.entries(RAW)) {
    const repStickers = stickers.filter(c => getRep(c) > 0);
    if (repStickers.length === 0) continue;
    hasAny = true;

    const block = document.createElement('div');
    block.className = 'rep-country-block';
    block.innerHTML = `
      <div class="rep-country-title">${country}</div>
      <div class="rep-stickers" id="rep-stickers-${country.replace(/[^a-z0-9]/gi,'_')}"></div>
    `;
    container.appendChild(block);

    const wrap = block.querySelector('.rep-stickers');
    for (const code of repStickers) {
      const tag = document.createElement('div');
      tag.className = 'rep-tag';
      tag.innerHTML = `
        <span>${code}</span>
        <div class="rep-count-ctrl">
          <button class="rep-btn-ctrl rep-minus" onclick="changeRep('${code}',-1)">−</button>
          <span class="rep-count">${getRep(code)}</span>
          <button class="rep-btn-ctrl rep-plus" onclick="changeRep('${code}',1)">+</button>
        </div>
      `;
      wrap.appendChild(tag);
    }
  }

  if (!hasAny) {
    container.innerHTML = `
      <div class="empty-state">
        <span class="emoji">🔁</span>
        <p>No tenés repetidas todavía.<br>Clic derecho en una figura para agregar una repetida.</p>
      </div>`;
  }
}

function changeRep(code, delta) {
  const cur = getRep(code);
  const newVal = cur + delta;
  if (newVal <= 0) {
    delete state.repeated[code];
  } else {
    state.repeated[code] = newVal;
  }
  saveState();
  renderRepetidas();
  renderAlbum();
  updateHeader();
  updateTabBadges();
}

// ========================
// PROGRESO
// ========================
function setSortProg(s) {
  currentSortProg = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sort-' + s).classList.add('active');
  renderProgreso();
}

function renderProgreso() {
  const container = document.getElementById('prog-container');
  container.innerHTML = '';

  let entries = Object.entries(RAW).map(([country, stickers]) => {
    const got = stickers.filter(c => isGot(c)).length;
    const total = stickers.length;
    const pct = total > 0 ? got / total : 0;
    return { country, got, total, pct, missing: total - got };
  });

  if (currentSortProg === 'alpha') entries.sort((a,b) => a.country.localeCompare(b.country));
  else if (currentSortProg === 'pct-asc') entries.sort((a,b) => a.pct - b.pct);
  else if (currentSortProg === 'pct-desc') entries.sort((a,b) => b.pct - a.pct);
  else if (currentSortProg === 'missing') entries.sort((a,b) => b.missing - a.missing);

  const completeCount = entries.filter(e => e.missing === 0).length;

  document.getElementById('sum-got').textContent = gotCount();
  document.getElementById('sum-missing').textContent = totalStickers() - gotCount();
  document.getElementById('sum-rep').textContent = repCount();
  document.getElementById('sum-complete').textContent = completeCount;

  for (const { country, got, total, pct, missing } of entries) {
    const pctRound = Math.round(pct * 100);
    const complete = missing === 0;
    const card = document.createElement('div');
    card.className = 'prog-card' + (complete ? ' complete' : '');
    card.innerHTML = `
      <div class="prog-card-header">
        <div class="prog-country">${complete ? '🏆 ' : ''}${country}</div>
        <div class="prog-pct">${pctRound}%</div>
      </div>
      <div class="prog-bar-wrap"><div class="prog-bar-inner" style="width:${pctRound}%"></div></div>
      <div class="prog-sub">
        <span>✓ ${got} conseguidas</span>
        <span>✗ ${missing} faltantes</span>
      </div>
    `;
    card.onclick = () => {
      document.querySelectorAll('.tab')[0].click();
      showView('album');
      document.getElementById('search-input').value = country;
      renderAlbum();
    };
    container.appendChild(card);
  }
}

// ========================
// HEADER & BADGES
// ========================
function updateHeader() {
  const got = gotCount();
  const total = totalStickers();
  const pct = Math.round(got / total * 100);
  document.getElementById('hdr-got').textContent = got;
  document.getElementById('hdr-total').textContent = total;
  document.getElementById('global-bar').style.width = pct + '%';
  document.getElementById('global-pct').textContent = pct + '%';
}

function updateTabBadges() {
  const missing = totalStickers() - gotCount();
  document.getElementById('tab-missing-badge').textContent = missing;
  document.getElementById('tab-rep-badge').textContent = Object.keys(state.repeated).length;
}

function refreshAll() {
  renderAlbum();
  updateHeader();
  updateTabBadges();
  // update progress if visible
  if (document.getElementById('view-progreso').classList.contains('active')) renderProgreso();
  if (document.getElementById('view-repetidas').classList.contains('active')) renderRepetidas();
}

// ========================
// INIT
// ========================
updateHeader();
updateTabBadges();
renderAlbum();
</script>
</body>
</html>
